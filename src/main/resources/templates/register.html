<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>新規ユーザー登録 - Expiry Manager</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- アプリ共通のBootstrap 5 & FontAwesome -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
        <style>
            body {
                background-color: #f4f6f9;
                color: #2d3748;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .register-card {
                max-width: 420px;
                width: 100%;
                background-color: #ffffff;
                padding: 2.5rem;
                border-radius: 16px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            }
            .icon-wrapper {
                width: 60px;
                height: 60px;
                background-color: rgba(79, 70, 229, 0.1);
                color: #4f46e5;
                font-size: 1.75rem;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border-radius: 50%;
                margin-bottom: 1rem;
            }
            .form-control {
                border-radius: 8px;
                padding: 0.6rem 1rem;
                border: 1px solid #e2e8f0;
            }
            .form-control:focus {
                border-color: #4f46e5;
                box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            }
            .btn-primary {
                background-color: #4f46e5;
                border: none;
                border-radius: 8px;
                padding: 0.7rem;
                font-weight: 600;
                transition: all 0.2s;
            }
            .btn-primary:hover {
                background-color: #4338ca;
            }
            .alert-danger {
                border-radius: 8px;
                font-size: 0.9rem;
                padding: 0.75rem 1rem;
            }
        </style>
    </head>

    <body>
        <div class="container p-3">
            <div class="register-card mx-auto">
                <div class="text-center mb-4">
                    <div class="icon-wrapper">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <h1 class="h4 fw-bold m-0">新規ユーザー登録</h1>
                    <p class="text-muted small mt-1">アカウントを作成して管理をはじめましょう</p>
                </div>

                <form th:action="@{/register}" method="post">
                    <!-- エラーメッセージ（ユーザー名重複時など） -->
                    <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-3" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-2"></i>
                        <span th:text="${errorMessage}">ユーザー名が既に存在します</span>
                    </div>

                    <!-- ユーザー名入力 -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">ユーザー名</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-user"></i></span>
                            <input type="text" name="username" class="form-control border-start-0 ps-0" required placeholder="ユーザー名を入力">
                        </div>
                    </div>

                    <!-- パスワード入力 -->
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted">パスワード</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" name="password" class="form-control border-start-0 ps-0" required placeholder="パスワードを入力">
                        </div>
                    </div>

                    <!-- 登録ボタン -->
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary">登録する</button>
                    </div>
                </form>

                <!-- ログインへ戻るリンク -->
                <div class="text-center mt-4 border-top pt-3">
                    <p class="small text-muted mb-0">すでにアカウントをお持ちですか？</p>
                    <a th:href="@{/login}" class="small text-decoration-none fw-semibold text-primary">ログイン画面に戻る</a>
                </div>
            </div>
        </div>
    </body>
</html>
