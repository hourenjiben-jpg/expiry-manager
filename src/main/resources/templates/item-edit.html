<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>アイテム編集 - Expiry Manager</title>
        <meta name="description" content="登録済みのアイテム情報を編集するフォームです">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- 一覧・新規登録画面と合わせたBootstrap 5の導入 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body {
                background-color: #f4f6f9;
                color: #2d3748;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            }
            .form-container {
                max-width: 500px;
                margin: 4rem auto;
                background-color: #ffffff;
                padding: 2.5rem;
                border-radius: 12px;
                box-shadow: 0 4px 6px rgba(0,0,0,0.05), 0 1px 3px rgba(0,0,0,0.05);
            }
            .form-control {
                border-radius: 8px;
                padding: 0.6rem 1rem;
                border: 1px solid #e2e8f0;
            }
            .form-control:focus {
                border-color: #4f46e5;
                box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            }
            .btn-primary {
                background-color: #4f46e5;
                border: none;
                border-radius: 8px;
                padding: 0.6rem 1.5rem;
                font-weight: 500;
            }
            .btn-primary:hover {
                background-color: #4338ca;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <div class="form-container">
                <h1 class="h3 fw-bold mb-4 text-center">アイテム情報の編集</h1>
                
                <form th:action="@{/items/edit}" th:object="${item}" method="post">
                    
                    <!-- ID は hidden で保持（重要）-->
                    <input type="hidden" th:field="*{id}" />

                    <!-- 品名 -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">品名</label>
                        <input type="text" th:field="*{name}" class="form-control"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>       
                    </div>

                    <!-- カテゴリ -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">カテゴリ</label>
                        <input type="text" th:field="*{category}" class="form-control"
                               th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>       
                    </div>

                    <!-- 期限 -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">消費期限</label>
                        <input type="date" th:field="*{expiryDate}" class="form-control"
                               th:classappend="${#fields.hasErrors('expiryDate')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('expiryDate')}" th:errors="*{expiryDate}"></div>       
                    </div>

                    <!-- 価格 -->
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted">価格</label>
                        <div class="input-group">
                            <input type="number" th:field="*{price}" class="form-control"
                                   th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">
                            <span class="input-group-text">円</span>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>       
                        </div>
                    </div>
                    
                    <!-- ボタンエリア -->
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">変更を保存する</button>
                        <a href="/items" class="btn btn-outline-secondary btn-sm border-0 text-muted mt-2">キャンセルして戻る</a>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
